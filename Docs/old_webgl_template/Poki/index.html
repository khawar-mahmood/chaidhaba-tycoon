<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=yes">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #F6D2B4; touch-action: none; -webkit-user-select: none; user-select: none; }
    #unity-canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; background: #F6D2B4; outline: none; }
    #loader { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #F6D2B4; transition: opacity .3s; }
    #loader.hidden { opacity: 0; pointer-events: none; }
    #cup { width: 120px; height: 120px; }
    #tip { margin-top: 18px; font: 600 18px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; color: #2B1E2F; opacity: .75; text-align: center; padding: 0 24px; }
  </style>
  <!-- Poki SDK: the only external request the game makes -->
  <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader">
    <!-- A chai cup filling up is the progress bar -->
    <svg id="cup" viewBox="0 0 120 120" aria-hidden="true">
      <defs>
        <clipPath id="cupClip"><path d="M26 34 h60 l-7 58 a8 8 0 0 1 -8 7 h-30 a8 8 0 0 1 -8 -7 z"/></clipPath>
      </defs>
      <ellipse cx="56" cy="104" rx="44" ry="7" fill="#FFF4DE" stroke="#2B1E2F" stroke-width="4"/>
      <path d="M26 34 h60 l-7 58 a8 8 0 0 1 -8 7 h-30 a8 8 0 0 1 -8 -7 z" fill="#FFF8EA"/>
      <rect id="fill" x="20" y="99" width="72" height="0" fill="#B0703C" clip-path="url(#cupClip)"/>
      <path d="M26 34 h60 l-7 58 a8 8 0 0 1 -8 7 h-30 a8 8 0 0 1 -8 -7 z" fill="none" stroke="#2B1E2F" stroke-width="4" stroke-linejoin="round"/>
      <path d="M85 46 c16 0 16 26 -3 26" fill="none" stroke="#2B1E2F" stroke-width="5" stroke-linecap="round"/>
      <path d="M44 22 c-6 -6 6 -10 0 -16 M58 22 c-6 -6 6 -10 0 -16 M72 22 c-6 -6 6 -10 0 -16" fill="none" stroke="#2B1E2F" stroke-width="3" stroke-linecap="round" opacity=".45"/>
    </svg>
    <div id="tip">Brewing chai…</div>
  </div>
  <script>
    // Block the page scrolling on arrow keys / space (Poki embeds games in a scrolling page).
    window.addEventListener("keydown", function (e) {
      if ([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) e.preventDefault();
    }, { passive: false });

    var tips = ["Stand on a tile to build it", "Customers in a hurry tip more", "Staff work while you build", "Collect tea leaves for perks"];
    document.getElementById("tip").textContent = tips[Math.floor(Math.random() * tips.length)];

    var canvas = document.getElementById("unity-canvas");
    var loader = document.getElementById("loader");
    var fill = document.getElementById("fill");
    function setProgress(p) {
      var h = Math.max(0, Math.min(1, p)) * 66;
      fill.setAttribute("y", String(99 - h));
      fill.setAttribute("height", String(h));
    }

    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
      workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      // keep cheap phones fast: never render above 2x
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    };

    function startUnity() {
      var script = document.createElement("script");
      script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        createUnityInstance(canvas, config, setProgress).then(function () {
          setProgress(1);
          loader.classList.add("hidden");
          setTimeout(function () { loader.style.display = "none"; }, 350);
          canvas.focus();
        }).catch(function (message) { console.error(message); });
      };
      document.body.appendChild(script);
    }

    // PokiSDK.init(), then load the game whether or not init succeeds (ad blockers).
    window.__pokiInitDone = true;
    try {
      if (window.PokiSDK && PokiSDK.init) PokiSDK.init().then(startUnity).catch(startUnity);
      else startUnity();
    } catch (e) { startUnity(); }
  </script>
</body>
</html>
